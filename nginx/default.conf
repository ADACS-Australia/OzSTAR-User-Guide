server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    # Legacy URL redirects (HTTP 301).
    # Relative ../ paths resolve cleanly both at root (http://host:8002/...)
    # and behind a subpath reverse proxy (https://supercomputing.swin.edu.au/docs/...).
    # /1-getting_started/Policies.html is intentionally frozen in place.

    # Getting Started
    location = /1-getting_started/Accounts.html { return 301 ../getting-started/accounts.html; }
    location = /1-getting_started/2fa.html { return 301 ../getting-started/2fa.html; }
    location = /1-getting_started/Swinburne-HPC.html { return 301 ../getting-started/systems.html; }
    location = /1a-nt_oz/what-s-new.html { return 301 ../getting-started/systems.html; }
    location = /1a-nt_oz/migration.html { return 301 ../getting-started/systems.html#porting-between-clusters; }

    # Access & Shell
    location = /1-getting_started/Access.html { return 301 ../access/ssh-access.html; }
    location = /1-getting_started/restricted-keys.html { return 301 ../access/restricted-keys.html; }
    location = /1-getting_started/Linux.html { return 301 ../access/linux-environment.html; }
    location = /1-getting_started/manual.html { return 301 ../access/linux-environment.html#reading-man-pages; }
    location = /2-ozstar/Workflow.html { return 301 ../access/linux-environment.html#dotfiles-and-shell-hygiene; }

    # Storage & Data
    location = /1-getting_started/Filesystems.html { return 301 ../storage/filesystems.html; }
    location = /1-getting_started/Datasets.html { return 301 ../storage/filesystems.html#shared-datasets; }
    location = /1-getting_started/file-transfer.html { return 301 ../storage/file-transfer.html; }
    location = /1-getting_started/Optimising-Lustre.html { return 301 ../storage/optimising-lustre.html; }

    # Software
    location = /2-ozstar/Modules.html { return 301 ../software/modules.html; }
    location = /2-ozstar/Installing.html { return 301 ../software/modules.html#installing-your-own-software; }
    location = /2-ozstar/Python.html { return 301 ../software/python.html; }
    location = /2-ozstar/Notebooks.html { return 301 ../software/notebooks.html; }
    location = /2-ozstar/Apptainer.html { return 301 ../software/apptainer.html; }
    location = /2-ozstar/apptainer-examples.html { return 301 ../software/apptainer-examples.html; }

    # Running Jobs
    location = /2-ozstar/oz-slurm-create.html { return 301 ../jobs/creating-jobs.html; }
    location = /2-ozstar/oz-partition.html { return 301 ../jobs/resources-and-interactive.html; }
    location = /2-ozstar/oz-slurm-examples.html { return 301 ../jobs/examples.html; }
    location = /2-ozstar/oz-slurm-details.html { return 301 ../jobs/monitoring.html#command-line-tools; }
    location = /3-jobmon/monitoring.html { return 301 ../jobs/monitoring.html; }
    location = /2-ozstar/oz-slurm-basics.html { return 301 ../jobs/slurm-reference.html; }
    location = /2-ozstar/ligo-reporting.html { return 301 ../jobs/ligo-reporting.html; }

    # Help & Support
    location = /1-getting_started/FAQ.html { return 301 ../help/faq.html; }
    location = /1-getting_started/Support.html { return 301 ../help/support.html; }

    location / {
        try_files $uri $uri/ =404;
    }
}
